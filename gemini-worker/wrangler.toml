name = "truss-lab-gemini"
main = "src/worker.js"
compatibility_date = "2026-10-22"
workers_dev = true

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
# 배포한 게임의 실제 origin을 쉼표로 추가하세요. 경로나 마지막 /는 넣지 않습니다.
ALLOWED_ORIGINS = "http://127.0.0.1:8765,http://localhost:8765,http://127.0.0.1:5500,http://localhost:5500,https://jsjs101.github.io"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
